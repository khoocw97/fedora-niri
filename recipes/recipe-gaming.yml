---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: fedora-niri
# description will be included in the image's metadata
description: Personal OS - Gaming Edition

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - type: os-release
    properties:
      NAME: Fedora Niri Gaming
      PRETTY_NAME: Fedora Niri Atomic (Gaming)
      VARIANT: Niri Edition
      VARIANT_ID: niri
      ID: fedora
      ID_LIKE: fedora

  - from-file: general/niri.yml
  - from-file: general/packages.yml
  - from-file: general/gaming.yml  # all gaming stuff
  - from-file: general/flatpak.yml
  - from-file: general/config.yml

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
