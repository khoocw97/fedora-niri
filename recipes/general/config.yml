modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - setup-rime-build
      - install-megacmd
      - install-extest
      - install-maple-mono # font

  - type: script
    snippets:
      - "rm -rf /usr/share/doc/*"
      - "rm -rf /usr/src/*"

  - type: systemd
    system:
      enabled:
        - ly.service

      disabled:
        - getty@tty2.service
    user:
      enabled:
        - mega-cmd-server
        - niri-steam
        - udiskie

  - type: justfiles
    install: true
