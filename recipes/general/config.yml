modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - setup-rime-build
      - install-megacmd
      - install-extest
      - setup-firewall
      - install-fonts
      - install-papirus
      - setup-plymouth-theme

  - type: script
    snippets:
      - "rm -rf /usr/share/doc/*"
      - "rm -rf /usr/src/*"
      - "mkdir -p /etc/skel/.config/niri && cp -r /usr/share/niri-config/* /etc/skel/.config/niri/"
      - "ln -sf /etc/sddm/themes/simple-sddm/theme.conf /usr/share/sddm/themes/simple-sddm/theme.conf"
      - "systemctl set-default graphical.target"

  - type: systemd
    system:
      enabled:
        - sddm.service
        - hide-grub.service

      disabled:
        - getty@tty2.service
    user:
      enabled:
        - mega-cmd-server
        - polkit-agent
        - udiskie

  - type: justfiles
    install: true
    include:
      - setup-automount.just
      - pick-icon.just
      - setup-niri.just
      - setup-opentabletdriver.just
      - setup-rime.just
      - setup-shell.just
      - setup-virtualization.just
