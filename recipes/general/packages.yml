modules:
- type: dnf
  repos:
    cleanup: true
    copr:
      - lizardbyte/stable
      - lihaohong/yazi
      - imput/helium
      - atim/starship
      - khoocw97/software

  install:
    packages:
      # personal
      - starship
      - sddm # login manager
      - qt6-qtdeclarative
      - qt6-qtquickcontrols2
      - sddm-themes
      - oo7-daemon # Fedora 45 default secrets service (replaces gnome-keyring)
      - oo7-portal
      - pam_oo7 # unlock keyring
      - adw-gtk3-theme # unofficial GTK3 port of libadwaita
      - xdg-user-dirs # xdg user dirs
      - power-profiles-daemon
      - fuzzel
      - bibata-cursor-themes
      - meld
      - helium-bin
      - sunshine
      - kitty
      - yazi
      - nemo
      - kdeconnectd
      - udiskie
      - swayimg # image viewer
      # CLI tools
      - ripgrep
      - fd-find
      - chezmoi
      - zoxide
      - eza
      - fzf
      - bat
      - fastfetch
      - duf
      - gum
      - brightnessctl
      - playerctl
      # change to fcitx
      - fcitx5
      - fcitx5-rime
      - librime-lua
      - librime-octagram
      - fcitx5-gtk
      - fcitx5-qt
      - fcitx5-configtool
      # virtualization
      - libvirt
      - qemu-kvm
      - swtpm
      - swtpm-tools
      - edk2-ovmf
      - dnsmasq
      - vm-curator
      # font
      - install-weak-deps: false
        packages:
          - default-fonts-core-emoji
          - default-fonts
          - default-fonts-cjk-sans
          - google-noto-color-emoji-fonts
          - google-noto-emoji-fonts
          - google-noto-sans-cjk-vf-fonts
          - fira-code-fonts
          - glibc-all-langpacks
          - langpacks-zh_CN
          - langpacks-zh_TW
          - langpacks-core-zh_CN
          - langpacks-core-zh_TW
          - langpacks-fonts-zh_CN
          - langpacks-fonts-zh_TW
          # from copr
          - lxgw-fonts
          - maple-mono-fonts

  remove:
    auto-remove: false # only drop listed packages, never dependency auto-removal
    packages:
      - gnome-keyring
      - gnome-keyring-pam
      - firefox
      - firefox-langpacks
      - nvtop
      - htop
      - ibus
      - ibus-anthy
      - ibus-anthy-python
      - ibus-chewing
      - ibus-gtk3
      - ibus-gtk4
      - ibus-hangul
      - ibus-libpinyin
      - ibus-libs
      - ibus-m17n
      - ibus-setup
      - ibus-typing-booster
      - python3-ibus
