modules:
- type: dnf # personal
  repos:
    cleanup: true
    copr:
      - lizardbyte/stable
      - lihaohong/yazi
      - imput/helium
      - atim/starship
      - peterwu/rendezvous

  install:
    packages:
      - starship
      - ly # login manager
      - gnome-keyring-pam # unlock keyring
      - adw-gtk3-theme # unofficial GTK3 port of libadwaita
      - xdg-user-dirs # xdg user dirs
      - polkit-kde
      - power-profiles-daemon
      - bibata-cursor-themes
      - helium-bin
      - sunshine
      - kitty
      - yazi
      - nemo
      - kdeconnectd
      - udiskie

  remove:
    packages:
      - firefox
      - firefox-langpacks

- type: dnf # CLI tools
  repos:
    cleanup: true
  install:
    packages:
      - ripgrep
      - fd-find
      - chezmoi
      - zoxide
      - eza
      - fzf
      - bat
      - tealdeer
      - fastfetch
      - duf

- type: dnf # change to fcitx
  repos:
    cleanup: true
  install:
    packages:
      - fcitx5
      - fcitx5-chinese-addons
      - fcitx5-rime
      - fcitx5-gtk
      - fcitx5-qt
      - fcitx5-configtool
  remove:
    packages:
      - ibus
      - ibus-anthy
      - ibus-anthy-python
      - ibus-chewing
      - ibus-gtk3
      - ibus-gtk4
      - ibus-hangul
      - ibus-libpinyin
      - ibus-libs
      - ibus-m17n
      - ibus-setup
      - ibus-typing-booster
      - python3-ibus

- type: dnf # virtualization
  repos:
    cleanup: true
  install:
    packages:
      - libvirt
      - qemu-kvm
      - swtpm
      - swtpm-tools
      - edk2-ovmf
      - dnsmasq

- type: dnf # font
  repos:
    cleanup: true
  install:
    install-weak-deps: false
    packages:
      - default-fonts-core-emoji
      - default-fonts
      - default-fonts-cjk-sans
      - google-noto-color-emoji-fonts
      - google-noto-emoji-fonts
      - google-noto-sans-cjk-vf-fonts
      - fira-code-fonts
      - glibc-all-langpacks
      - langpacks-zh_CN
      - langpacks-zh_TW
      - langpacks-core-zh_CN
      - langpacks-core-zh_TW
      - langpacks-fonts-zh_CN
      - langpacks-fonts-zh_TW
