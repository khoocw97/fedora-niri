modules:
- type: dnf # Game
  repos:
    cleanup: true
    files:
      - https://negativo17.org/repos/fedora-steam.repo
  install:
    packages:
      - steam
      - gamescope
      - mangohud
      - vulkan-tools

- type: dnf # terra: mesa (gaming) + steam-notif-daemon
  repos:
    cleanup: true
    files:
      - terra.repo # files/dnf/terra.repo
      - terra-mesa.repo # files/dnf/terra-mesa.repo

  #install:
  #  packages:
  #    - steam-notif-daemon

  replace: # swap base mesa (negativo17 1:26.1.4-4) for terra mesa (1:26.1.6-3, OGC patches)
    - from-repo: terra-mesa
      packages:
        - mesa-dri-drivers
        - mesa-vulkan-drivers
        - mesa-libGL
        - mesa-libEGL
        - mesa-libgbm
        - mesa-filesystem

- type: files
  files:
    - source: gaming/usr
      destination: /usr
    - source: gaming/etc
      destination: /etc

- type: script
  scripts:
    #- ../gaming/scripts/install-lsfg
    - ../gaming/scripts/install-sdl-gamecontroller

- type: systemd
  user:
    enabled:
      - niri-steam

- type: justfiles
  include:
    - ../gaming/justfiles

# flatpak module
- type: default-flatpaks
  configurations:
    - notify: false
      scope: system
      install:
        - io.github.benjamimgois.goverlay
        - org.freedesktop.Platform.VulkanLayer.MangoHud//25.08 # goverlay
        - com.vysp3r.ProtonPlus
