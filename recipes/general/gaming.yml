modules:
- type: dnf # Game
  repos:
    cleanup: true
    files:
      - https://negativo17.org/repos/fedora-steam.repo
  install:
    packages:
      - steam
      - gamescope
      - mangohud

- type: files
  files:
    - source: gaming/usr
      destination: /usr
    - source: gaming/etc
      destination: /etc

- type: script
  scripts:
    - ../gaming/scripts/install-lsfg
    - ../gaming/scripts/install-sdl-gamecontroller

- type: systemd
  user:
    enabled:
      - niri-steam

- type: justfiles
  include:
    - ../gaming/justfiles

# flatpak module
- type: default-flatpaks
  configurations:
    - notify: false
      scope: system
      install:
        - io.github.benjamimgois.goverlay
        - org.freedesktop.Platform.VulkanLayer.MangoHud//25.08 # goverlay
        - com.vysp3r.ProtonPlus
